<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeroth Inventory Lite — Live Demo</title>
<meta name="description" content="Zeroth Inventory Lite: product master, purchases, sales, live stock, low-stock alerts and monthly reports for small manufacturers. Fictional demo data.">
<style>
:root{
  --bg:#070d17;--bg-2:#0b1220;--panel:#101b2d;--panel-2:#152238;--panel-3:#1a2a42;
  --line:#21324b;--line-soft:#1a293f;--text:#e9eef7;--muted:#92a4bd;--muted-2:#6d809a;
  --gold:#c9ab73;--gold-2:#a07d3f;--gold-soft:rgba(201,171,115,.12);
  --green:#3ddc97;--green-soft:rgba(61,220,151,.12);--red:#ff7f7f;--red-soft:rgba(255,127,127,.12);
  --amber:#f0b95a;--amber-soft:rgba(240,185,90,.13);--blue:#74a9ff;--blue-soft:rgba(116,169,255,.12);
  --radius:14px;--radius-sm:9px;--shadow:0 26px 70px -34px rgba(0,0,0,.85);
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --display:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(900px 500px at 82% -8%,rgba(201,171,115,.07),transparent 60%),radial-gradient(700px 500px at -10% 20%,rgba(116,169,255,.06),transparent 55%),var(--bg);
  color:var(--text);font:14px/1.55 var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh;
}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:rgba(201,171,115,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#243650;border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:256px;flex:0 0 256px;background:linear-gradient(180deg,#0a1322,#08101d);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px;border-bottom:1px solid var(--line-soft)}
.brand-mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#d8bf8c,#a07d3f);color:#0b1220;font-family:var(--display);font-size:22px;font-weight:700;box-shadow:0 8px 20px -10px rgba(201,171,115,.6)}
.brand-name{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.28em;line-height:1.1}
.brand-sub{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.workspace{margin:14px 14px 6px;padding:12px 13px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:linear-gradient(160deg,rgba(201,171,115,.07),rgba(116,169,255,.03))}
.ws-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.ws-name{font-size:13px;font-weight:600;margin-top:4px;line-height:1.3}
.ws-meta{font-size:11px;color:var(--muted);margin-top:2px}
.nav{padding:10px 10px 16px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);font-weight:700;padding:10px 12px 6px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;font-size:13px;transition:.15s}
.nav-btn svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--muted-2)}
.nav-btn:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-btn.active{background:linear-gradient(90deg,rgba(201,171,115,.15),rgba(201,171,115,.04));color:#f3e6ce;box-shadow:inset 2px 0 var(--gold)}
.nav-btn.active svg{color:var(--gold)}
.nav-count{margin-left:auto;font-size:10px;font-weight:700;background:var(--red-soft);color:var(--red);padding:1px 6px;border-radius:20px}
.side-foot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid var(--line-soft)}
.help-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 12px;color:var(--text);display:flex;gap:10px;align-items:flex-start}
.help-card:hover{border-color:var(--gold-2)}
.help-card b{display:block;font-size:12px;margin-bottom:2px}
.help-card span{font-size:10.5px;color:var(--muted);line-height:1.4}
.help-card .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.13);margin-top:5px;flex:0 0 7px}
.side-note{font-size:10px;color:var(--muted-2);line-height:1.5;margin-top:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px 28px;background:rgba(7,13,23,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.topbar h1{font-size:17px;font-weight:650;margin:0;letter-spacing:.01em}
.topbar p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.demo-pill{font-size:9px;font-weight:800;letter-spacing:.14em;background:var(--gold-soft);color:var(--gold);border:1px solid rgba(201,171,115,.28);padding:4px 8px;border-radius:20px}
.menu-btn{display:none!important}
.view{padding:24px 28px 48px;max-width:1400px;width:100%;margin:0 auto}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--panel-3);border-color:#2c4160}
.btn.primary{background:linear-gradient(145deg,#d8bf8c,#b08c4b);border-color:#c9ab73;color:#171006;font-weight:700;box-shadow:0 10px 24px -14px rgba(201,171,115,.8)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(255,127,127,.28);background:var(--red-soft)}
.btn.sm{padding:6px 10px;font-size:11.5px;border-radius:7px}
.btn.icon{padding:6px 8px;font-size:12px}
.btn:focus-visible,.nav-btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--muted)}
.icon-btn:hover{background:var(--panel-2);color:var(--text);border-color:var(--line)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green);border-color:rgba(61,220,151,.2)}
.badge.amber{background:var(--amber-soft);color:var(--amber);border-color:rgba(240,185,90,.22)}
.badge.red{background:var(--red-soft);color:var(--red);border-color:rgba(255,127,127,.22)}
.badge.blue{background:var(--blue-soft);color:var(--blue);border-color:rgba(116,169,255,.22)}
.badge.gold{background:var(--gold-soft);color:var(--gold);border-color:rgba(201,171,115,.25)}
.badge.muted{background:rgba(255,255,255,.05);color:var(--muted);border-color:var(--line)}
.panel{background:linear-gradient(165deg,rgba(21,34,56,.86),rgba(16,27,45,.92));border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.panel-head h2{font-size:13px;margin:0;font-weight:650;letter-spacing:.01em}
.panel-head p{font-size:11px;color:var(--muted);margin:2px 0 0}
.panel-head .right{margin-left:auto;display:flex;gap:7px;align-items:center}
.panel-body{padding:18px}
.grid{display:grid;gap:16px}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:16px}
.kpi{padding:17px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:auto -20px -40px auto;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(201,171,115,.09),transparent 70%)}
.kpi .k-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.kpi .k-value{font-size:25px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .k-foot{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-icon{position:absolute;right:15px;top:15px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line-soft);color:var(--gold)}
.kpi .k-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.up{color:var(--green)}.down{color:var(--red)}
.money{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:11px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.022)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .p-name{font-weight:600;color:var(--text);min-width:120px}
td .p-code{font-size:10px;color:var(--muted-2);margin-top:1px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.toolbar .grow{flex:1}
.input{background:#0b1524;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 11px;font-size:12.5px;min-width:0}
.input::placeholder{color:var(--muted-2)}
.input:focus{border-color:var(--gold-2);outline:none;box-shadow:0 0 0 3px rgba(201,171,115,.1)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field .input{width:100%}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .span2{grid-column:span 2}
.hint{font-size:11px;color:var(--muted-2);margin:0}
.err{font-size:11.5px;color:var(--red);margin:8px 0 0;display:none}
.err.show{display:block}
@media(max-width:1050px){.cols-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1024px){
  .sidebar{position:fixed;left:-270px;transition:.22s;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .sidebar.open{left:0}
  .menu-btn{display:grid!important}
}
@media(max-width:860px){.split,.cols-2{grid-template-columns:1fr}}
@media(max-width:720px){
  .sidebar{position:fixed;left:-270px;transition:.22s;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .sidebar.open{left:0}
  .menu-btn{display:grid!important}
  .topbar{padding:12px 16px}
  .topbar p{display:none}
  .top-actions .hide-sm{display:none}
  .view{padding:16px 14px 40px}
  .cols-4,.cols-3,.cols-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .form-grid .span2{grid-column:auto}
  .kpi .k-value{font-size:22px}
}
/* ---------- chart ---------- */
.chart{width:100%;height:220px;display:flex;align-items:flex-end;gap:14px;padding:8px 4px 0}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;min-width:0}
.chart-bars{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:155px;width:100%}
.chart-bar{width:42%;max-width:22px;border-radius:4px 4px 2px 2px;min-height:2px;transition:height .3s}
.chart-bar.sales{background:linear-gradient(180deg,#d8bf8c,#a07d3f)}
.chart-bar.purch{background:linear-gradient(180deg,#3b5f8f,#2b4568)}
.chart-label{font-size:10px;color:var(--muted-2);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:10.5px;color:var(--muted);align-items:center}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.legend .s{background:linear-gradient(180deg,#d8bf8c,#a07d3f)}
.legend .p{background:linear-gradient(180deg,#3b5f8f,#2b4568)}
/* ---------- progress ---------- */
.bar-row{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.bar-row:last-child{border-bottom:0}
.bar-row .n{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .v{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar-track{grid-column:1/-1;height:5px;border-radius:20px;background:rgba(255,255,255,.05);overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#a07d3f,#d8bf8c)}
.mini-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--muted)}
.mini-foot b{font-size:13px;color:var(--green)}
.mini-foot b.gold{color:var(--gold)}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:0}
.list-dot{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700}
.list-dot.in{background:var(--blue-soft);color:var(--blue)}
.list-dot.out{background:var(--green-soft);color:var(--green)}
.list-main{min-width:0;flex:1}
.list-main b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-main span{font-size:10.5px;color:var(--muted)}
.list-amt{font-size:12px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- modal / toast ---------- */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(2,6,12,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 30px;overflow-y:auto}
.modal{width:100%;max-width:540px;background:linear-gradient(170deg,#162338,#0f1a2b);border:1px solid #2a3d5a;border-radius:16px;box-shadow:0 40px 100px -20px #000;animation:pop .18s ease-out}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:17px 19px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px;margin:0;font-weight:650}
.modal-body{padding:19px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 19px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b2b44;border:1px solid #31496c;color:var(--text);padding:10px 17px;border-radius:9px;font-size:12.5px;box-shadow:0 20px 50px -15px #000;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- print ---------- */
.print-head{display:none}
@media print{
  body{background:#fff;color:#111}
  .sidebar,.topbar,#toast,.no-print{display:none!important}
  .app{display:block}
  .view{padding:0;max-width:none}
  .panel{background:#fff;border:1px solid #ddd;box-shadow:none;border-radius:0}
  .panel-head,td,th{border-color:#ddd}
  th{color:#555}
  .kpi .k-value,td .p-name,.kpi .k-label{color:#111}
  .muted,.kpi .k-foot,.panel-head p{color:#555}
  .badge{border:1px solid #bbb;color:#111!important;background:#fff!important}
  .print-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
  .print-head h1{font-size:20px;margin:0}
  .print-head p{margin:2px 0 0;font-size:11px;color:#555}
  a{text-decoration:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">Z</div>
      <div><div class="brand-name">ZEROTH</div><div class="brand-sub">Digital Systems</div></div>
    </div>
    <div class="workspace">
      <div class="ws-label">Live demo workspace</div>
      <div class="ws-name">Sri Balaji Precision Works</div>

    </div>

</div>

<script>
/* ============================================================
   Zeroth Inventory Lite — standalone demo
   Fictional data for Sri Balaji Precision Works (Coimbatore).
   Everything is stored locally in this browser.
   ============================================================ */
const KEY = "zeroth_inventory_lite_v1";
const BRAND = {
  company: "Sri Balaji Precision Works",
  location: "Coimbatore, Tamil Nadu",
  owner: "R. Balaji",
  currency: "₹",
  builtBy: "Zeroth Digital Systems"
};

function iso(d){ const m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return d.getFullYear()+"-"+m+"-"+day; }
function dateAgo(monthsAgo, day){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth()-monthsAgo, 1);
  const maxDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  let dd = Math.min(day, maxDay);
  if (monthsAgo === 0) dd = Math.min(dd, now.getDate());
  d.setDate(Math.max(1, dd));
  return iso(d);
}
function p(id,code,name,cat,unit,opening,reorder,cost,price){
  return { id, code, name, cat, unit, opening, reorder, cost, price };
}

function seedDb(){
  const products = [

let DB;
try {
  const raw = localStorage.getItem(KEY);
  DB = raw ? JSON.parse(raw) : seedDb();
} catch(e){ DB = seedDb(); }
if(!DB || !Array.isArray(DB.products)) DB = seedDb();

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function n(v){ const x=Number(v); return isFinite(x) ? x : 0; }
function money(v){ return BRAND.currency + new Intl.NumberFormat("en-IN",{maximumFractionDigits:0}).format(n(v)); }
function money2(v){ return BRAND.currency + new Intl.NumberFormat("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n(v)); }
function qty(v){ return new Intl.NumberFormat("en-IN",{maximumFractionDigits:2}).format(n(v)); }
function today(){ return iso(new Date()); }
function monthKey(dateStr){ return String(dateStr).slice(0,7); }
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monthLabel(key){
  const parts = String(key).split("-");
  const m = Number(parts[1])-1;
  return (MONTHS[m]||"") + " " + parts[0];
}
function dateLabel(dateStr){
  const d = new Date(String(dateStr)+"T00:00:00");
  if(isNaN(d)) return dateStr;
  return d.getDate()+" "+MONTHS[d.getMonth()];
}
function thisMonth(){ return monthKey(today()); }

const productById = id => DB.products.find(x => x.id === id);
function purchasedQty(id){ return DB.purchases.filter(x => x.productId===id).reduce((s,x)=>s+n(x.qty),0); }
function soldQty(id){ return DB.sales.filter(x => x.productId===id).reduce((s,x)=>s+n(x.qty),0); }
function stockOf(p){ return n(p.opening) + purchasedQty(p.id) - soldQty(p.id); }
function stockStatus(p){
  const s = stockOf(p);
  if(s <= 0) return "out";
  if(s <= n(p.reorder)) return "low";
  return "ok";
}
function lowStock(){ return DB.products.filter(p => stockOf(p) <= n(p.reorder)); }
function nextProductCode(){
  let max = 0;
  DB.products.forEach(p => { const m = String(p.code).match(/(\d+)$/); if(m) max = Math.max(max, Number(m[1])); });
  return "ZIL-" + String(max+1).padStart(4,"0");
}
function monthOptions(){
  const set = new Set([thisMonth()]);
  DB.sales.forEach(x => set.add(monthKey(x.date)));
  DB.purchases.forEach(x => set.add(monthKey(x.date)));
  return Array.from(set).sort().reverse();
}
function lastMonths(count){
  const out = [];
  const now = new Date();
  for(let i=count-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));
  }
  return out;
}
function salesIn(month){ const rows = DB.sales.filter(x => monthKey(x.date)===month); return { rows, revenue: rows.reduce((s,x)=>s+n(x.qty)*n(x.rate),0), units: rows.reduce((s,x)=>s+n(x.qty),0) }; }
function purchasesIn(month){ const rows = DB.purchases.filter(x => monthKey(x.date)===month); return { rows, spend: rows.reduce((s,x)=>s+n(x.qty)*n(x.rate),0), units: rows.reduce((s,x)=>s+n(x.qty),0) }; }
function cogsIn(month){
  return DB.sales.filter(x => monthKey(x.date)===month).reduce((s,x)=>{ const p=productById(x.productId); return s + n(x.qty)*(p?n(p.cost):0); },0);
}
function stockValue(){ return DB.products.reduce((s,p)=>s + Math.max(0,stockOf(p))*n(p.cost),0); }

/* ---------- overview ---------- */
function pctChange(current, previous){
  if(!previous) return current ? "New this month" : "No activity yet";
  const d = ((current-previous)/previous)*100;
  return (d>=0?"▲ ":"▼ ") + Math.abs(d).toFixed(1) + "% vs last month";
}
function renderOverview(){
  const month = thisMonth();
  const prevDate = new Date(); prevDate.setMonth(prevDate.getMonth()-1);
  const prev = prevDate.getFullYear()+"-"+String(prevDate.getMonth()+1).padStart(2,"0");
  const cur = salesIn(month), last = salesIn(prev), buys = purchasesIn(month);
  const low = lowStock().sort((a,b)=> (stockOf(a)/Math.max(1,n(a.reorder))) - (stockOf(b)/Math.max(1,n(b.reorder))));
  const months = lastMonths(6);
  const series = months.map(m => ({ m, s:salesIn(m).revenue, p:purchasesIn(m).spend }));
  const max = Math.max(1, ...series.map(x=>Math.max(x.s,x.p)));
  const chart = series.map(x => `
    <div class="chart-col">
      <div class="chart-bars" title="${monthLabel(x.m)} · sales ${money(x.s)} · purchases ${money(x.p)}">
        <div class="chart-bar sales" style="height:${Math.max(2,(x.s/max)*100)}%"></div>
        <div class="chart-bar purch" style="height:${Math.max(2,(x.p/max)*100)}%"></div>
      </div>
      <div class="chart-label">${monthLabel(x.m).split(" ")[0]}</div>
    </div>`).join("");

  const topMap = {};
  DB.sales.filter(x => monthKey(x.date)===month).forEach(x => {
    const p = productById(x.productId); const name = p ? p.name : "Deleted product";
    topMap[name] = (topMap[name]||0) + n(x.qty)*n(x.rate);
  });
  let top = Object.entries(topMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!top.length){
    const all = {};
    DB.sales.forEach(x => { const p=productById(x.productId); const name=p?p.name:"Deleted product"; all[name]=(all[name]||0)+n(x.qty)*n(x.rate); });
    top = Object.entries(all).sort((a,b)=>b[1]-a[1]).slice(0,5);
  }
  const topMax = Math.max(1, ...top.map(t=>t[1]));
  const topHtml = top.length ? top.map(([name,val]) => `
    <div class="bar-row"><div class="n">${esc(name)}</div><div class="v">${money(val)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,(val/topMax)*100)}%"></div></div></div>`).join("")
    : `<div class="empty"><b>No sales yet</b>Record your first sale to see product performance.</div>`;

  const activity = DB.sales.map(x=>({...x,type:"sale"})).concat(DB.purchases.map(x=>({...x,type:"purchase"})))
    .sort((a,b)=> String(b.date).localeCompare(String(a.date))).slice(0,7);
  const activityHtml = activity.length ? activity.map(x => {
    const p = productById(x.productId);
    const isSale = x.type === "sale";
    return `<div class="list-row">
      <div class="list-dot ${isSale?"out":"in"}">${isSale?"↑":"↓"}</div>
      <div class="list-main"><b>${esc(p?p.name:"Deleted product")} <span class="muted">× ${qty(x.qty)}</span></b>
      <span>${isSale ? esc(x.customer) : esc(x.supplier)} · ${dateLabel(x.date)}</span></div>
      <div class="list-amt ${isSale?"up":""}">${isSale?"+":"−"}${money(n(x.qty)*n(x.rate))}</div>
    </div>`;
  }).join("") : `<div class="empty"><b>No transactions yet</b>Add a purchase or a sale to get started.</div>`;

  const lowHtml = low.length ? low.slice(0,6).map(p => {
    const s = stockOf(p);
    return `<div class="list-row">
      <div class="list-dot out" style="background:${s<=0?"var(--red-soft)":"var(--amber-soft)"};color:${s<=0?"var(--red)":"var(--amber)"}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
      <div class="list-main"><b>${esc(p.name)}</b><span>${qty(s)} ${esc(p.unit)} left · reorder at ${qty(p.reorder)}</span></div>
      <button class="btn sm" onclick="openPurchase('${p.id}')">Restock</button>
    </div>`;
  }).join("") : `<div class="empty"><b>All stock levels are healthy</b>No item is at or below its reorder level.</div>`;

  return `
  <div class="grid cols-4" style="margin-bottom:16px">
    <div class="panel kpi"><div class="k-label">Stock value (at cost)</div><div class="k-value">${money(stockValue())}</div><div class="k-foot">${DB.products.length} products · ${DB.products.reduce((s,p)=>s+Math.max(0,stockOf(p)),0).toLocaleString("en-IN")} units on hand</div><div class="k-icon">${ICONS.stock}</div></div>
    <div class="panel kpi"><div class="k-label">Sales this month</div><div class="k-value">${money(cur.revenue)}</div><div class="k-foot ${cur.revenue>=last.revenue?"up":"down"}">${pctChange(cur.revenue,last.revenue)}</div><div class="k-icon">${ICONS.sales}</div></div>
    <div class="panel kpi"><div class="k-label">Purchases this month</div><div class="k-value">${money(buys.spend)}</div><div class="k-foot">${buys.rows.length} ${buys.rows.length===1?"entry":"entries"} · ${qty(buys.units)} units received</div><div class="k-icon">${ICONS.purchases}</div></div>
    <div class="panel kpi"><div class="k-label">Low-stock items</div><div class="k-value" style="color:${low.length?"var(--amber)":"var(--green)"}">${low.length}</div><div class="k-foot">${low.length?`<span class="badge amber">Needs attention</span>`:`<span class="badge green">All clear</span>`}</div><div class="k-icon">${ICONS.products}</div></div>
  </div>

  <div class="split" style="margin-bottom:16px">
    <div class="panel">
      <div class="panel-head"><div><h2>Sales vs purchases</h2><p>Last 6 months · ${monthLabel(months[0])} to ${monthLabel(months[5])}</p></div><div class="right"><div class="legend"><span><i class="s"></i>Sales</span><span><i class="p"></i>Purchases</span></div></div></div>
      <div class="panel-body"><div class="chart">${chart}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>Top products</h2><p>By revenue${top.length?" · "+monthLabel(month):""}</p></div><div class="right"><span class="badge gold">This month</span></div></div>
      <div class="panel-body" style="padding-top:6px;padding-bottom:12px">${topHtml}<div class="mini-foot"><span>Gross profit this month</span><b>${money(cur.revenue-cogsIn(month))}</b></div></div>
    </div>
  </div>

  <div class="split">
    <div class="panel">
      <div class="panel-head"><div><h2>Low-stock alerts</h2><p>At or below the reorder level</p></div><div class="right"><span class="badge ${low.length?"amber":"green"}">${low.length?low.length+" items":"Healthy"}</span></div></div>
      <div class="panel-body" style="padding-top:4px;padding-bottom:12px">${lowHtml}<div class="mini-foot"><span>Stock value at cost</span><b class="gold">${money(stockValue())}</b></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>Recent activity</h2><p>Latest purchases and sales</p></div><div class="right"><button class="btn ghost sm" onclick="go('reports')">Reports</button></div></div>
      <div class="panel-body" style="padding-top:4px;padding-bottom:4px">${activityHtml}</div>
    </div>
  </div>`;
}

  const s = stockOf(p), st = stockStatus(p);

  if(st==="low") return `<span class="badge amber">Low · ${qty(s)}</span>`;
  return `<span class="badge green">${qty(s)} ${esc(p.unit)}</span>`;
}

function saveProduct(id){
  const name = document.getElementById("pf-name").value.trim();
  const cat = document.getElementById("pf-cat").value.trim() || "Uncategorised";
  const unit = document.getElementById("pf-unit").value;
  const opening = n(document.getElementById("pf-opening").value);
  const reorder = n(document.getElementById("pf-reorder").value);
  const cost = n(document.getElementById("pf-cost").value);
  const price = n(document.getElementById("pf-price").value);
  const err = document.getElementById("modalErr");
  if(!name){ err.textContent="Enter a product name."; err.classList.add("show"); return; }
  if(opening<0 || reorder<0 || cost<0 || price<0){ err.textContent="Numbers cannot be negative."; err.classList.add("show"); return; }
  if(price < cost){ err.textContent="Selling price is below cost price. Check the numbers before saving."; err.classList.add("show"); return; }
  if(id){
    const p = productById(id);
    Object.assign(p,{name,cat,unit,opening,reorder,cost,price});
    toast("Product updated");
  } else {
    DB.products.push({ id:uid("p"), code:nextProductCode(), name, cat, unit, opening, reorder, cost, price });
    toast("Product added · code generated");
  }
  save(); closeModal(); render();
}
function deleteProduct(id){
  const p = productById(id); if(!p) return;
  const tx = DB.purchases.filter(x=>x.productId===id).length + DB.sales.filter(x=>x.productId===id).length;
  if(!confirm(`Delete ${p.name}?${tx?` This also removes ${tx} linked purchase/sale entries.`:""}`)) return;
  DB.products = DB.products.filter(x=>x.id!==id);
  DB.purchases = DB.purchases.filter(x=>x.productId!==id);
  DB.sales = DB.sales.filter(x=>x.productId!==id);
  save(); render(); toast("Product deleted");
}

function openLedger(id){
  const p = productById(id); if(!p) return;
  const moves = [];
  DB.purchases.filter(x=>x.productId===id).forEach(x=>moves.push({...x,kind:"purchase"}));
  DB.sales.filter(x=>x.productId===id).forEach(x=>moves.push({...x,kind:"sale"}));
  moves.sort((a,b)=> String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id)));
  let bal = n(p.opening);
  const rows = [`<tr><td class="muted">Starting</td><td><span class="badge muted">Opening</span></td><td class="muted">—</td><td class="num">${qty(p.opening)}</td><td class="num">${qty(bal)}</td></tr>`]
    .concat(moves.map(x=>{
      const isSale = x.kind==="sale";
      bal += isSale ? -n(x.qty) : n(x.qty);
      return `<tr><td>${dateLabel(x.date)}</td><td><span class="badge ${isSale?"green":"blue"}">${isSale?"Sale":"Purchase"}</span></td><td>${esc(isSale?x.customer:x.supplier)}</td><td class="num" style="color:${isSale?"var(--red)":"var(--green)"}">${isSale?"−":"+"}${qty(x.qty)}</td><td class="num">${qty(bal)}</td></tr>`;
    }));
  openModal("Stock ledger · "+p.name, `
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px">
      <div><div class="muted small">On hand</div><div style="font-size:20px;font-weight:700">${qty(stockOf(p))} ${esc(p.unit)}</div></div>
      <div><div class="muted small">Purchased</div><div style="font-size:20px;font-weight:700">${qty(purchasedQty(p.id))}</div></div>
      <div><div class="muted small">Sold</div><div style="font-size:20px;font-weight:700">${qty(soldQty(p.id))}</div></div>
      <div><div class="muted small">Stock value</div><div style="font-size:20px;font-weight:700">${money(Math.max(0,stockOf(p))*n(p.cost))}</div></div>
    </div>
    <div class="table-wrap" style="border:1px solid var(--line-soft);border-radius:9px">
      <table><thead><tr><th>Date</th><th>Type</th><th>Party</th><th class="num">Qty</th><th class="num">Balance</th></tr></thead><tbody>${rows.join("")}</tbody></table>
    </div>`,
    `<button class="btn" onclick="closeModal()">Close</button>`);
}

function renderStock(){
  let rows = DB.products.slice();

  if(state.stockFilter==="out") rows = rows.filter(p=>stockStatus(p)==="out");
  rows.sort((a,b)=> (stockOf(a)/Math.max(1,n(a.reorder))) - (stockOf(b)/Math.max(1,n(b.reorder))));
  const body = rows.length ? rows.map(p=>{
    const s = stockOf(p), st = stockStatus(p);
    return `<tr>
      <td><div class="p-name">${esc(p.name)}</div><div class="p-code">${esc(p.code)}</div></td>

      <td class="num muted">${qty(p.reorder)}</td>

  }).join("") : `<tr><td colspan="9"><div class="empty"><b>Nothing here</b>No products match this filter.</div></td></tr>`;

  return `
  <div class="grid cols-4" style="margin-bottom:16px">

  </div>
  <div class="panel">
    <div class="toolbar">

  </div>
  <p class="hint" style="margin-top:10px">Opening stock is the starting count you enter once. Every purchase adds to it and every sale subtracts from it — the balance is always live.</p>`;
}

/* ---------- reports ---------- */
let reportMonth = thisMonth();
function renderReports(){
  const months = monthOptions();
  if(!months.includes(reportMonth)) reportMonth = months[0] || thisMonth();
  const s = salesIn(reportMonth), pu = purchasesIn(reportMonth), cogs = cogsIn(reportMonth);
  const profit = s.revenue - cogs;
  const margin = s.revenue ? (profit/s.revenue)*100 : 0;

  const byProduct = {};
  s.rows.forEach(x=>{
    const p = productById(x.productId);
    const key = p ? p.id : "deleted";
    if(!byProduct[key]) byProduct[key] = { name:p?p.name:"Deleted product", cat:p?p.cat:"—", qty:0, revenue:0, cost:0 };
    byProduct[key].qty += n(x.qty);
    byProduct[key].revenue += n(x.qty)*n(x.rate);
    byProduct[key].cost += n(x.qty)*(p?n(p.cost):0);
  });
  const prodRows = Object.values(byProduct).sort((a,b)=>b.revenue-a.revenue);
  const prodHtml = prodRows.length ? prodRows.map(r=>`<tr>
    <td><div class="p-name">${esc(r.name)}</div><div class="p-code">${esc(r.cat)}</div></td>
    <td class="num">${qty(r.qty)}</td><td class="num">${money(r.revenue)}</td>
    <td class="num" style="color:var(--green)">${money(r.revenue-r.cost)}</td>
    <td class="num">${r.revenue?((r.revenue-r.cost)/r.revenue*100).toFixed(0):0}%</td>
  </tr>`).join("") : `<tr><td colspan="5"><div class="empty"><b>No sales in ${monthLabel(reportMonth)}</b>Choose another month or record a sale.</div></td></tr>`;

  const byCat = {};
  s.rows.forEach(x=>{ const p=productById(x.productId); const cat=p?p.cat:"—"; byCat[cat]=(byCat[cat]||0)+n(x.qty)*n(x.rate); });
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const catTotal = catRows.reduce((sum,r)=>sum+r[1],0);
  const catHtml = catRows.length ? catRows.map(([cat,val])=>`
    <div class="bar-row"><div class="n">${esc(cat)}</div><div class="v">${money(val)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,(val/catTotal)*100)}%"></div></div></div>`).join("")
    : `<div class="empty" style="padding:20px 0"><b>No category data</b>Record a sale for this month.</div>`;

  const salesRows = s.rows.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const salesHtml = salesRows.length ? salesRows.map(x=>{
    const p=productById(x.productId);
    return `<tr><td>${dateLabel(x.date)}</td><td>${esc(x.customer)}</td><td>${p?esc(p.name):"—"}</td><td class="num">${qty(x.qty)}</td><td class="num">${money(n(x.qty)*n(x.rate))}</td></tr>`;
  }).join("") : `<tr><td colspan="5"><div class="empty" style="padding:20px"><b>No sales</b>Nothing invoiced this month.</div></td></tr>`;

  const purchaseRows = pu.rows.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const purchaseHtml = purchaseRows.length ? purchaseRows.map(x=>{
    const p=productById(x.productId);
    return `<tr><td>${dateLabel(x.date)}</td><td>${esc(x.supplier)}</td><td>${p?esc(p.name):"—"}</td><td class="num">${qty(x.qty)}</td><td class="num">${money(n(x.qty)*n(x.rate))}</td></tr>`;
  }).join("") : `<tr><td colspan="5"><div class="empty" style="padding:20px"><b>No purchases</b>Nothing received this month.</div></td></tr>`;

  return `
  <div class="no-print toolbar" style="padding:0 0 14px;border:0">
    <div class="grow" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <select class="input" onchange="setReportMonth(this.value)" aria-label="Report month">
        ${months.map(m=>`<option value="${m}" ${m===reportMonth?"selected":""}>${monthLabel(m)}</option>`).join("")}
      </select>
      <span class="muted small">Gross profit = sales − cost of goods sold. Purchases are cash out, not cost of goods.</span>
    </div>
    <button class="btn ghost sm" onclick="exportReportCsv()">Export CSV</button>
    <button class="btn sm" onclick="window.print()">Print / PDF</button>
  </div>

  <div class="print-head">
    <div><h1>${esc(BRAND.company)}</h1><p>Monthly operations report · ${monthLabel(reportMonth)}</p></div>
    <div style="text-align:right"><p>Generated ${dateLabel(today())}<br>Prepared with Zeroth Inventory Lite</p></div>
  </div>

  <div class="grid cols-4" style="margin-bottom:16px">
    <div class="panel kpi"><div class="k-label">Sales revenue</div><div class="k-value">${money(s.revenue)}</div><div class="k-foot">${s.rows.length} invoices · ${qty(s.units)} units</div></div>
    <div class="panel kpi"><div class="k-label">Cost of goods sold</div><div class="k-value">${money(cogs)}</div><div class="k-foot">At product cost price</div></div>
    <div class="panel kpi"><div class="k-label">Gross profit</div><div class="k-value" style="color:${profit>=0?"var(--green)":"var(--red)"}">${money(profit)}</div><div class="k-foot">${s.revenue?margin.toFixed(1)+"% margin":"No sales this month"}</div></div>
    <div class="panel kpi"><div class="k-label">Purchases</div><div class="k-value">${money(pu.spend)}</div><div class="k-foot">${pu.rows.length} ${pu.rows.length===1?"entry":"entries"} · stock added</div></div>
  </div>

  <div class="split" style="margin-bottom:16px">
    <div class="panel">
      <div class="panel-head"><div><h2>Product performance</h2><p>Sold in ${monthLabel(reportMonth)}</p></div><div class="right"><span class="badge gold">${monthLabel(reportMonth)}</span></div></div>
      <div class="table-wrap"><table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Revenue</th><th class="num">Gross profit</th><th class="num">Margin</th></tr></thead><tbody>${prodHtml}</tbody></table></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>Revenue by category</h2><p>Share of sales this month</p></div></div>
      <div class="panel-body" style="padding-top:8px">${catHtml}</div>
    </div>
  </div>

  <div class="grid cols-2">
    <div class="panel">
      <div class="panel-head"><div><h2>Sales register</h2><p>${monthLabel(reportMonth)} · ${money(s.revenue)}</p></div></div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Product</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead><tbody>${salesHtml}</tbody></table></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>Purchase register</h2><p>${monthLabel(reportMonth)} · ${money(pu.spend)}</p></div></div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Supplier</th><th>Product</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead><tbody>${purchaseHtml}</tbody></table></div>
    </div>
  </div>
  <p class="hint" style="margin-top:12px">Demo report generated from fictional data. Your live system uses your products, suppliers and customers.</p>`;
}
function setReportMonth(v){ reportMonth = v; render(); }
function csvDownload(filename, header, rows){
  const content = [header, ...rows].map(r => r.map(v => `"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\ufeff"+content], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function exportReportCsv(){
  const s = salesIn(reportMonth);
  const rows = s.rows.map(x=>{
    const p = productById(x.productId);
    return [x.date, x.invoice||"", x.customer, p?p.name:"", p?p.code:"", x.qty, x.rate, n(x.qty)*n(x.rate), p?n(p.cost)*n(x.qty):0];
  });
  csvDownload("zeroth-sales-"+reportMonth+".csv",
    ["Date","Invoice","Customer","Product","Code","Qty","Rate","Revenue","Cost"], rows);
  toast("Sales CSV downloaded");
}

/* ---------- modal ---------- */
function openModal(title, body, footer, wide){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" style="margin-left:auto" onclick="closeModal()" aria-label="Close">✕</button></div>
      <div class="modal-body">${body}</div>
      ${footer?`<div class="modal-foot">${footer}</div>`:""}
    </div></div>`;
  root.classList.add("open");
  document.body.classList.add("modal-open");
  setTimeout(()=>{ const f = root.querySelector("input,select,textarea,button"); if(f) f.focus(); },40);
}
function closeModal(){
  document.getElementById("modalRoot").classList.remove("open");
  document.getElementById("modalRoot").innerHTML = "";
  document.body.classList.remove("modal-open");
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- reset & init ---------- */
function resetDemo(){
  if(!confirm("Reset all demo data to the original fictional sample?")) return;
  DB = seedDb(); save(); state.productSearch=""; state.stockFilter="all"; reportMonth = thisMonth();
  render(); toast("Demo data reset");
}
function init(){
  document.querySelectorAll(".nav-btn").forEach(b=>{
    const ico = b.querySelector(".ico");
    if(ico) ico.innerHTML = ICONS[b.dataset.view] || "";
  });
  const hash = (location.hash||"").replace("#","");
  if(VIEW_META[hash]) state.view = hash;
  render();
}
